events {
  worker_connections 1024;
}

http {

  upstream ms-auth {
    server ms-auth:3000;
  }

  upstream ms-crear {
    server ms-crear:3001;
  }

  upstream ms-modificar {
    server ms-modificar:3002;
  }

  upstream ms-borrar {
    server ms-borrar:3003;
  }

  upstream ms-consultar {
    server ms-consultar:3004;
  }

  upstream ms-log {
    server ms-log:3005;
  }

  server {
    listen 80;

    # ── Validación interna de token ──────────────────────────
    location = /auth/validate {
      internal;
      proxy_pass http://ms-auth/auth/validate;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
    }

    # ── Crear persona ────────────────────────────────────────
    location /api/personas/crear {
      auth_request /auth/validate;
      auth_request_set $usuario $upstream_http_x_usuario;
      proxy_set_header X-Usuario $usuario;
      proxy_pass http://ms-crear/personas;
    }

    # ── Modificar persona ────────────────────────────────────
    location ~ ^/api/personas/modificar/(.+)$ {
      auth_request /auth/validate;
      auth_request_set $usuario $upstream_http_x_usuario;
      proxy_set_header X-Usuario $usuario;
      proxy_pass http://ms-modificar/personas/$1;
    }

    # ── Borrar persona ───────────────────────────────────────
    location ~ ^/api/personas/borrar/(.+)$ {
      auth_request /auth/validate;
      auth_request_set $usuario $upstream_http_x_usuario;
      proxy_set_header X-Usuario $usuario;
      proxy_pass http://ms-borrar/personas/$1;
    }

    # ── Consultar persona ────────────────────────────────────
    location ~ ^/api/personas/consultar/(.+)$ {
      auth_request /auth/validate;
      auth_request_set $usuario $upstream_http_x_usuario;
      proxy_set_header X-Usuario $usuario;
      proxy_pass http://ms-consultar/personas/$1;
    }

    # ── Consultar log ────────────────────────────────────────
    location /api/log {
      auth_request /auth/validate;
      auth_request_set $usuario $upstream_http_x_usuario;
      proxy_set_header X-Usuario $usuario;
      proxy_pass http://ms-log/log;
    }

    # ── Error de autenticación ───────────────────────────────
    error_page 401 = @error401;
    location @error401 {
      return 401 '{"error": "No autorizado"}';
      add_header Content-Type application/json;
    }

    # ── Servicio no disponible ───────────────────────────────
    error_page 502 503 = @error503;
    location @error503 {
      return 503 '{"error": "Servicio no disponible"}';
      add_header Content-Type application/json;
    }
  }
}
